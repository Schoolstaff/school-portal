<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal - Attendance & ID Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8f9fa; color: #333; }
        header { background: #1b365d; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; }
        header a { color: white; text-decoration: none; font-size: 14px; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 4px; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h3 { margin-bottom: 15px; color: #1b365d; font-size: 16px; border-bottom: 2px solid #f0f2f5; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-scan { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 5px; }
        .btn-scan:hover { background: #218838; }
        .attendance-list { list-style: none; margin-top: 10px; max-height: 200px; overflow-y: auto; }
        .attendance-list li { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .status-present { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Teacher Dashboard</h1>
        <a href="index.html">Logout</a>
    </header>

    <div class="container">
        <!-- Scanner Card -->
        <div class="card">
            <h3>📷 Student ID & Attendance Scanner</h3>
            <div class="form-group">
                <label>Select Class / Subject</label>
                <select id="classSelect">
                    <option value="Form 3A">Form 3A - Mathematics</option>
                    <option value="Form 4B">Form 4B - Physics</option>
                </select>
            </div>
            <div class="form-group">
                <label>Scan Barcode or Enter Student ID</label>
                <input type="text" id="studentIdInput" placeholder="Scan ID card or type ID..." autofocus>
            </div>
            <button class="btn-scan" onclick="markAttendance()">Mark Present</button>
        </div>

        <!-- Today's Attendance Log -->
        <div class="card">
            <h3>📋 Marked Present Today (<span id="count">0</span>)</h3>
            <ul id="attendanceList" class="attendance-list">
                <li style="color: #888; text-align: center;">No students scanned yet today.</li>
            </ul>
        </div>
    </div>

    <script>
        const scannedStudents = [];

        function markAttendance() {
            const input = document.getElementById('studentIdInput');
            const studentId = input.value.trim();
            const className = document.getElementById('classSelect').value;

            if (!studentId) {
                alert('Please enter or scan a Student ID.');
                return;
            }

            // Check if already scanned
            if (scannedStudents.includes(studentId)) {
                alert('Student ' + studentId + ' is already marked present!');
                input.value = '';
                return;
            }

            scannedStudents.push(studentId);
            updateList();
            input.value = '';
            input.focus();
        }

        function updateList() {
            const listElement = document.getElementById('attendanceList');
            const countElement = document.getElementById('count');
            countElement.textContent = scannedStudents.length;

            if (scannedStudents.length === 0) {
                listElement.innerHTML = '<li style="color: #888; text-align: center;">No students scanned yet today.</li>';
                return;
            }

            listElement.innerHTML = '';
            scannedStudents.forEach((id, index) => {
                const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const li = document.createElement('li');
                li.innerHTML = `<span>${index + 1}. Student ID: <strong>${id}</strong></span> <span class="status-present">Present (${timeNow})</span>`;
                listElement.appendChild(li);
            });
        }
    </script>
</body>
</html>
